version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - tic_pgdata:/var/lib/postgresql/data
      - ./backend/fixtures/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: python:3.11-slim
    working_dir: /app
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Fakes every endpoint in openapi.yaml so the dashboard team never blocks
  # on the real backend being finished. Point dashboard API calls here
  # until Module C's real endpoints are ready, then swap the base URL only.
  mock-server:
    image: node:20-alpine
    working_dir: /spec
    volumes:
      - ./:/spec:ro
    ports:
      - "${MOCK_SERVER_PORT:-4010}:4010"
    command: >
      sh -c "npx --yes @stoplight/prism-cli mock -h 0.0.0.0 -p 4010 openapi.yaml"

volumes:
  tic_pgdata:
