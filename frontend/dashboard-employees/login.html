<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Authentication — TICK</title>
  <link rel="icon" type="image/x-icon" href="assets/icon/images/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="background-color: #03060B;">
  <main class="auth-page-wrapper">
    <!-- Ambient Diffuse Glow Orbs (Figma Specification) -->
    <div class="ambient-orb orb-green"></div>
    <div class="ambient-orb orb-purple"></div>
    <div class="ambient-orb orb-blue"></div>

    <div class="auth-split-grid">
      
      <!-- Left Hero Pane (Figma 171:85) -->
      <div class="auth-hero-pane">
        <div class="auth-hero-welcome">
          <h2>WELCOME TO</h2>
          <img src="assets/icon/images/logo.png" alt="TICK Logo" class="auth-hero-logo" />
        </div>
        <p class="auth-hero-tagline">
          Smarter Work. Better Balance. Stronger Teams.
        </p>
      </div>

      <!-- Right Card Pane (Figma 171:85) -->
      <div class="auth-card-pane">
        <div class="auth-card">
          <h1 class="auth-card-title">Authentication</h1>

          <!-- Segmented Portal Control (Employee vs Admin) -->
          <div class="segmented-portal-control">
            <div class="segmented-portal-tab active">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
              <span>Employee Portal</span>
            </div>
            <a href="../dashboard-manager/login.html" class="segmented-portal-tab">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
              <span>Admin Portal</span>
            </a>
          </div>

          <!-- Employee Login Form -->
          <form id="employeeLoginForm">
            <div class="form-group">
              <label class="form-label" for="employeeIdInput">Employee ID or Corporate Email</label>
              <div class="auth-input-container">
                <svg class="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input type="email" class="auth-input" id="employeeIdInput" placeholder="ID / Email" required />
              </div>
            </div>

            <div class="form-group">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <label class="form-label" for="employeePassword">Password</label>
                <a href="#forgot" style="font-size: 0.75rem; color: #38BDF8; font-weight: 500;">Forgot credentials?</a>
              </div>
              <div class="auth-input-container">
                <svg class="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input type="password" class="auth-input" id="employeePassword" placeholder="Password" required />
                <span class="auth-password-toggle" onclick="togglePass('employeePassword', this)">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </span>
              </div>
            </div>

            <!-- Remember this device checkbox (Figma Specification) -->
            <div style="display: flex; align-items: center; gap: 0.6rem; margin-top: 1rem;">
              <input type="checkbox" id="rememberDeviceEmp" style="accent-color: #10B981; width: 16px; height: 16px; cursor: pointer;" />
              <label for="rememberDeviceEmp" style="font-size: 0.8125rem; color: #94A3B8; cursor: pointer;">Remember this device</label>
            </div>

            <!-- Continue Button (Figma 171:85) -->
            <button type="submit" class="auth-continue-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
              <span>Continue</span>
            </button>

            <div id="loginErrorMsg" style="display: none; margin-top: 1rem; padding: 0.75rem 1rem; background-color: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 6px; font-size: 0.8125rem; color: #F87171; font-weight: 500; text-align: center;"></div>
          </form>

          <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle);">
            <a href="../index.html" style="font-size: 0.8125rem; color: #94A3B8; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
              &larr; Back to TICK Portal
            </a>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    function togglePass(id, btn) {
      const input = document.getElementById(id);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.style.color = '#38BDF8';
      } else {
        input.type = 'password';
        btn.style.color = '#64748B';
      }
    }
  </script>
  <script src="js/login.js"></script>
</body>
</html>
