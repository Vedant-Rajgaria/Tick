<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — TICK</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="background-color: #F9FAFB;">
  <main class="welcome-container">
    <div class="auth-box">
      <!-- Minimalist Brand Header -->
      <div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem;">
        <div class="brand-mark">T</div>
        <span class="brand-title" style="font-size: 1.15rem; letter-spacing: 0.06em;">TICK</span>
      </div>

      <h1 style="font-size: 1.35rem; font-weight: 700; color: #111827; text-align: center; margin-bottom: 1.5rem;">
        Admin Login
      </h1>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label" for="adminEmail">Email</label>
          <input type="email" class="form-input" id="adminEmail" value="admin@tick.workforce" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPassword">Password</label>
          <input type="password" class="form-input" id="adminPassword" value="••••••••••••" required />
        </div>

        <div style="margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary w-full" style="width: 100%; padding: 0.65rem;">
            Login
          </button>
        </div>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid #E5E7EB;">
        <a href="../index.html" style="font-size: 0.8125rem; color: #4B5563; font-weight: 500; display: inline-flex; align-items: center; gap: 4px;">
          ← Back to TICK
        </a>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
